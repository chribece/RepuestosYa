name: RepuestosYa CI/CD - Firma y Lanzamiento Móvil

on:
  push:
    branches:
      - main # Se dispara de forma automática al hacer push a la rama principal

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código fuente del monorepo
    # fetch-depth 0: el plugin de Sentry usa `releases set-commits --auto`
    # y necesita el historial completo, no un clon superficial.
    - name: Checkout del repositorio
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. Configurar el entorno de Java (Necesario para el compilador de Android)
    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 3. Configurar el entorno oficial de Flutter
    - name: Configurar Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true # Almacena en caché los paquetes para compilar más rápido

    # 4. Instalar las dependencias limpias del pubspec
    - name: Instalar dependencias
      run: flutter pub get

    # 5. Ejecutar los filtros estrictos de control de calidad antes de compilar
    - name: Verificar formato del código
      run: dart format --set-exit-if-changed .

    - name: Análisis estático de código
      run: flutter analyze

    # 6. Ejecutar las 240 pruebas unitarias y E2E en la nube
    - name: Ejecutar la suite de pruebas (240 tests)
      run: flutter test

    # 7. Recrear el archivo Keystore físico desde el texto Base64 de forma segura
    # La ruta es android/app/ porque Gradle resuelve storeFile=repuestosya-upload.jks
    # relativo al módulo app (ver android/app/build.gradle.kts).
    - name: Decodificar y restaurar Keystore de producción
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/repuestosya-upload.jks

    # 8. Generar el archivo key.properties dinámico para que Gradle lo lea en la nube
    # Las contraseñas se pasan como variables de entorno y se escriben con
    # printf (%s): así los caracteres especiales del secreto ($, ", \, espacios)
    # NO se interpretan como sintaxis de shell (el `echo "${{ secrets.X }}"`
    # los corrompía y producía "keystore password was incorrect").
    # Además se verifica el keystore ANTES de compilar: si la contraseña del
    # almacén no coincide, el fallo es inmediato y claro (no 7 min de build).
    - name: Crear key.properties y verificar keystore
      env:
        KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=repuestosya-upload.jks\n' \
          "$KEY_STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
        keytool -list -keystore android/app/repuestosya-upload.jks \
          -storepass "$KEY_STORE_PASSWORD" -alias "$KEY_ALIAS" -noprompt

    # 9. Extraer la versión semántica de pubspec.yaml para sincronizar artefactos
    - name: Extraer versión de la aplicación
      id: get_version
      run: |
        VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //')
        echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

    # 10. Compilar el APK y el App Bundle (.aab) firmados y ofuscados de producción
    # --strip: quita el DWARF sin ofuscar del ELF (el símbolo de ofuscación va
    # a split-debug-info y se sube a Sentry). Requiere Flutter estable reciente.
    - name: Compilar APK y AAB de producción
      run: |
        flutter build apk --release --obfuscate --strip --split-debug-info=build/simbolos/${{ env.APP_VERSION }} --dart-define=APP_VERSION=${{ env.APP_VERSION }}
        flutter build appbundle --release --obfuscate --strip --split-debug-info=build/simbolos/${{ env.APP_VERSION }} --dart-define=APP_VERSION=${{ env.APP_VERSION }}

    # 11. Ejecutar la subida automática de los símbolos de desofuscación a Sentry
    - name: Subir símbolos de depuración a Sentry
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        SENTRY_ORG: "vcore-tech"
        SENTRY_PROJECT: "repuestosya-mobile"
      run: dart run sentry_dart_plugin

    # 12. Guardar el APK y AAB listos como artefactos de descarga en GitHub
    - name: Almacenar productos generados en GitHub Actions
      uses: actions/upload-artifact@v4
      with:
        name: repuestosya-release-artifacts-${{ env.APP_VERSION }}
        path: |
          build/app/outputs/flutter-apk/app-release.apk
          build/app/outputs/bundle/release/app-release.aab
